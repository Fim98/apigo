name: Bug report
description: Report a reproducible problem
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Do not include real API tokens, cookies or client certificates.
        Redact secrets from logs and screenshots.
  - type: input
    id: version
    attributes:
      label: apigo version
      placeholder: 0.4.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple silicon)
        - macOS (Intel)
        - Windows
        - Linux
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open collection ...
        2. Send request ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the error message and, if possible, the request timeline.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Bruno version used for comparison, collection snippet (redacted), logs.
